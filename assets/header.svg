<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="170" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Subtle Accent Radial Glows -->
    <radialGradient id="cyanGlow" cx="92%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="8%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient for Name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .badge-primary {
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
      .badge-secondary {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        fill: #a5b4fc;
      }
      .title-text {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.6px;
        fill: url(#nameGrad);
      }
      .subtitle-text {
        font-size: 16px;
        font-weight: 450;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Container Box with Hairline Slate Border -->
  <rect width="918" height="168" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2">
    <animate attributeName="stroke" values="#1e293b;#334155;#1e293b" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect width="918" height="168" x="1" y="1" rx="14" fill="url(#cyanGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="8s" repeatCount="indefinite" />
  </rect>
  <rect width="918" height="168" x="1" y="1" rx="14" fill="url(#indigoGlow)">
    <animate attributeName="opacity" values="0.7;0.95;0.7" dur="10s" repeatCount="indefinite" />
  </rect>

  <!-- Content Group -->
  <g transform="translate(46, 30)" class="font-sans">
    <!-- Role Badges (Full-Stack + Exploring DevOps) -->
    <g transform="translate(0, 0)">
      <!-- Primary Badge: Full-Stack Developer -->
      <rect width="202" height="24" rx="12" fill="#0369a1" fill-opacity="0.22" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="13" cy="12" r="3.5" fill="#38bdf8">
        <animate attributeName="r" values="3.5;4.2;3.5" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <text x="25" y="16.2" class="badge-primary">Full-Stack Developer</text>

      <!-- Secondary Learning Badge: Exploring DevOps -->
      <g transform="translate(212, 0)">
        <rect width="186" height="24" rx="12" fill="#4338ca" fill-opacity="0.2" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.45"/>
        <circle cx="13" cy="12" r="3.5" fill="#818cf8">
          <animate attributeName="r" values="3.5;4.2;3.5" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" begin="0.6s" repeatCount="indefinite" />
        </circle>
        <text x="25" y="16.2" class="badge-secondary">Exploring DevOps</text>
      </g>
    </g>

    <!-- Name Heading -->
    <text x="0" y="68" class="title-text">SHAHIN SHA CHAKKINGATHODI</text>

    <!-- Subtitle Line -->
    <text x="0" y="102" class="subtitle-text">B.Tech Computer Science Student  •  Building Resilient Systems &amp; Modern Web Architectures</text>
  </g>
</svg>
