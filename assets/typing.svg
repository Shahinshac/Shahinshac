<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 520 42'
    style='background-color: #00000000;'
    width='520px' height='42px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

    <!-- Sleek Terminal Pill Container matching Header style -->
    <rect width="518" height="40" x="1" y="1" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='6800ms' fill='remove'
                    values='m0,21 h0 ; m0,21 h520 ; m0,21 h520 ; m0,21 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Full-Stack Developer
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6800ms' fill='remove'
                    values='m0,21 h0 ; m0,21 h520 ; m0,21 h520 ; m0,21 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Building Practical Software Systems
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='6800ms' fill='remove'
                    values='m0,21 h0 ; m0,21 h520 ; m0,21 h520 ; m0,21 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Exploring DevOps &amp; Cloud
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='6800ms' fill='remove'
                    values='m0,21 h0 ; m0,21 h520 ; m0,21 h520 ; m0,21 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path3'>
            Turning Ideas Into Real Software
        </textPath>
    </text>
</svg>
